apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: titanic-prod

resources:
  - ../../base

namePrefix: titanic-prod-

commonLabels:
  environment: production

images:
  - name: ghcr.io/REPO_OWNER/titanic-api
    newTag: main

patches:
  - target:
      kind: Deployment
      name: titanic-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
  - target:
      kind: HorizontalPodAutoscaler
      name: titanic-api-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target:
      kind: PodDisruptionBudget
      name: titanic-api-pdb
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
  - target:
      kind: PersistentVolumeClaim
      name: titanic-db-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 100Gi

configMapGenerator:
  - name: titanic-api-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
