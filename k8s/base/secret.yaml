apiVersion: v1
kind: Secret
metadata:
  name: titanic-api-secrets
  namespace: titanic-api
type: Opaque
stringData:
  # These values should be replaced via CI/CD or sealed-secrets
  DATABASE_USER: "titanic_user"
  DATABASE_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  JWT_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  # DATABASE_URL will be constructed from the above values
