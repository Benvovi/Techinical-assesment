  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml

commonLabels:
  app: titanic-api
  managed-by: kustomize
