apiVersion: v1
kind: Service
metadata:
  name: titanic-api-service
  namespace: titanic-api
  labels:
    app: titanic-api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: titanic-api
---
apiVersion: v1
kind: Service
metadata:
  name: titanic-api-loadbalancer
  namespace: titanic-api
  labels:
    app: titanic-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  - port: 443
    targetPort: 5000
    protocol: TCP
    name: https
  selector:
    app: titanic-api
