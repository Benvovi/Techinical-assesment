version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: titanic-api-dev
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DATABASE_URL=postgresql+psycopg2://titanic_user:titanic_password@db:5432/titanic_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./src:/app/src:ro
      - ./run.py:/app/run.py:ro
    networks:
      - titanic-network-dev
    command: python -m flask run --host=0.0.0.0 --port=5000 --reload

  db:
    image: postgres:15-alpine
    container_name: titanic-db-dev
    environment:
      - POSTGRES_USER=titanic_user
      - POSTGRES_PASSWORD=titanic_password
      - POSTGRES_DB=titanic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
      - ./titanic.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titanic_user -d titanic_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - titanic-network-dev

volumes:
  postgres-data-dev:
    driver: local

networks:
  titanic-network-dev:
    driver: bridge
