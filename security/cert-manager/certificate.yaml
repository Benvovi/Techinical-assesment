# TLS Certificate for Titanic API
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: titanic-api-tls
  namespace: titanic-api
spec:
  secretName: titanic-api-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - titanic-api.example.com  # Change to your domain
  - api.titanic.example.com
